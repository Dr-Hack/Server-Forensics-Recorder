# server-forensics default configuration
#
# This file is intentionally simple shell syntax. Keep values unquoted unless a
# path contains spaces. Installed systems may override these defaults in:
#   /etc/server-forensics/config.conf

# Normal collection cadence. The systemd timer also uses a 60 second cadence.
INTERVAL=60

# Watcher thresholds. Panic mode starts when any threshold is crossed.
LOAD_THRESHOLD=10
LSPHP_THRESHOLD=40
MEMORY_THRESHOLD_MB=500
ESTABLISHED_THRESHOLD=300
DSTATE_THRESHOLD=5

# Minimum seconds after an incident closes before another one may be created.
PANIC_COOLDOWN=300

# Number of incident directories to keep. Older incidents are compressed into
# archive/ and removed from incidents/. On a chronically-stalling box (~7
# incidents/day) 50 keeps roughly a week of history — enough for the recurring-
# pattern correlation — at about half the disk of 100.
KEEP_INCIDENTS=50

# Runtime paths.
LOG_DIR=/var/log/server-forensics

# Optional behavior flags.
DEBUG=0
VERBOSE=1
QUIET=0

# Lightweight collector timeout for optional commands.
COLLECTOR_COMMAND_TIMEOUT=1

# Optional MySQL/MariaDB client credentials file. Leave empty to rely on the
# client's normal lookup (root's ~/.my.cnf, socket auth, etc). Set an absolute
# path when credentials live elsewhere, e.g. a dedicated monitoring account:
#   MYSQL_DEFAULTS_FILE=/etc/server-forensics/mysql.cnf
# It is passed to mysqladmin as --defaults-extra-file for status collection.
MYSQL_DEFAULTS_FILE=

# Panic snapshot behavior. These are not normally tuned, but are exposed so busy
# production servers can reduce the diagnostic footprint if needed.
PANIC_SNAPSHOT_INTERVAL=10
PANIC_COMMAND_TIMEOUT=20
PANIC_OUTPUT_LINES=5000

# D-state / blocking forensics. Most incidents on this server were driven by
# uninterruptible (D-state) processes, so each panic snapshot also records which
# processes were blocked, on what kernel wait channel, and what maintenance was
# running. All of it is cheap /proc reads; package managers are DETECTED from the
# process table, never invoked. On incident close an analysis.txt is generated
# that names the most likely subsystem with a confidence level.
ENABLE_DSTATE_FORENSICS=1
# Read /proc/<pid>/stack and wchan for blocked processes (needs root; some
# hardened kernels restrict it). Set 0 to skip kernel stacks entirely.
PANIC_CAPTURE_KERNEL_STACK=1
# Cap on how many D-state PIDs get a kernel-stack read per snapshot, so a storm
# of blocked tasks can never make the recorder itself fan out.
PANIC_DSTATE_MAX_PIDS=25
# Rapid D-state sampling. Blocked tasks are transient (they block/unblock every
# few ms), so a single ps usually catches none — even mid-stall. The recorder
# samples the D-state set this many times at this interval and unions the PIDs,
# which is what actually catches them and builds the wait-channel histogram.
PANIC_DSTATE_SAMPLES=6
PANIC_DSTATE_INTERVAL=0.5
# Timeout for each per-PID /proc/<pid>/{syscall,stack} read (a deep-blocked task
# read could otherwise stall the recorder).
PANIC_DSTATE_READ_TIMEOUT=2
# How far after the incident trigger a per-process capture may land and still be
# treated as evidence OF that incident. Beyond this the offender tables are
# reported but specific-cause confidence is held at the inconclusive floor,
# because the capture may describe a different event: incident-20260728-183224's
# only snapshot landed 3h27m late, during an unrelated nightly dnf run, and was
# scored as the cause of a storage stall that had ended three hours earlier.
STALE_CAPTURE_SECONDS=300

# Peak CPU steal (%) above which an incident is flagged as coinciding with
# hypervisor contention. Steal is time this vCPU was runnable while the host gave
# the physical core to another tenant — it is produced by the provider's
# overcommit and cannot be caused by anything running here, which makes it the
# one metric in a hosting dispute that cannot be attributed back to the customer.
# Sustained single-digit steal is common on shared VPS; double digits is not.
#
# Note: cpu_busy_pct counts stolen time as busy (busy = total - idle - iowait,
# and total includes steal). That definition is deliberately unchanged so new
# samples stay comparable with every incident already recorded; instead, when
# steal exceeds this threshold the analysis states the overlap explicitly so a
# steal event is never silently scored as CPU saturation.
STEAL_NOTABLE_PCT=5
# Capture PSI (Pressure Stall Information) from /proc/pressure/{io,cpu,memory}
# during panic snapshots. On PSI-capable kernels this is the single best signal
# for telling storage stalls apart from CPU or memory stalls, even when CPU
# utilisation looks low. Three tiny /proc reads; skipped gracefully when the
# kernel lacks CONFIG_PSI. Set 0 to disable.
PANIC_CAPTURE_PSI=1

# Per-process I/O attribution. System metrics tell you the box is storage
# stalled; this tells you WHICH PROCESS was moving the bytes. During each panic
# snapshot the recorder samples pidstat -d (per-process read/write), pidstat -u
# (per-process CPU) and iostat -x (per-device) over the same window, then ranks
# processes into an "offending processes" table and captures full /proc detail
# for the ones above the threshold. Requires sysstat (pidstat, iostat).
#
# The three samplers run CONCURRENTLY, so the wall-clock cost is one sampling
# window (PANIC_IO_SAMPLES x PANIC_IO_INTERVAL), not three. Note that the panic
# loop period becomes max(PANIC_SNAPSHOT_INTERVAL, that window).
ENABLE_IO_FORENSICS=1
PANIC_IO_SAMPLES=10
PANIC_IO_INTERVAL=1
# A process is treated as an offender (and gets a full detail block) when it
# accounts for more than this percentage of all observed disk I/O in the window.
PANIC_IO_OFFENDER_PCT=5
# Always detail at least this many top processes, even in a diffuse incident,
# and never more than the maximum, so the recorder cannot fan out under a storm.
PANIC_IO_MIN_OFFENDERS=3
PANIC_IO_MAX_OFFENDERS=10
# Rows shown in the rendered offending-processes table.
PANIC_IO_TABLE_ROWS=20
# Hard cap on lines retained from each sampler. A box with thousands of processes
# must not be able to fill the disk it is already stalled on.
PANIC_IO_MAX_LINES=20000
# Upper bound on distinct PIDs the ranking will track, so a fork storm cannot
# grow the ranking arrays without limit.
PANIC_IO_MAX_TRACKED_PIDS=5000
# Per-offender open-file lines retained (lsof and /proc/<pid>/fd each).
PANIC_IO_LSOF_LINES=60
# Timeout for the cheap per-offender reads. lsof can block on a stalled mount,
# so every detail read is bounded.
PANIC_IO_DETAIL_TIMEOUT=5
# Lines of `dmesg` (kernel ring buffer) tail captured — OOM-killer, ext4/jbd2
# journal errors, block/virtio timeouts during the stall.
PANIC_DMESG_LINES=200

# Pre-incident process ring buffer. Panic mode is triggered by load1, a
# one-minute average that LAGS the work causing it, so a sub-minute burst is
# always sampled on its way down — the per-process tables end up describing the
# recovery, not the event. The ring samples continuously and cheaply so the
# analysis can look BACKWARDS into the run-up.
#
# The ring never declares an incident. Enabling it cannot change when panic mode
# fires; it only records.
ENABLE_PROC_RING=1
# Seconds of history retained. At ~25 lines per sample this stays small.
RINGBUFFER_RETAIN_SECONDS=900
# How far before an incident's start the analysis reads back.
RINGBUFFER_LOOKBACK_SECONDS=300
# Rows kept per sample.
RINGBUFFER_TOP_EXECS=15
RINGBUFFER_TOP_PIDS=10
# PHP endpoint rows kept per sample. On a single-account box the abused URL/script
# is the culprit, not "lsphp"; these rows name it from the worker's rewritten argv.
RINGBUFFER_TOP_PHP=10
# Kernel wait-channel rows kept per sample. These ride along on the `ps` the ring
# already runs, so they cost no extra process. They are the ONLY reliable source
# of wait channels on this box: the panic-time sampler starts 13-29s after the
# trigger and blocked tasks have cleared by then. Rows are emitted only when
# something was actually blocked, so an idle server adds no lines.
RINGBUFFER_TOP_WCHAN=8

# Adaptive sampling. Between timer ticks the watcher polls /proc/loadavg (a
# single small read) every RINGBUFFER_POLL_INTERVAL seconds and takes a full
# sample only while load1 exceeds RINGBUFFER_FAST_LOAD. On an idle server the
# steady-state cost is therefore one `ps` per minute.
#
# RINGBUFFER_FAST_LOAD is deliberately far below LOAD_THRESHOLD: the point is to
# already be sampling quickly by the time the panic threshold is crossed.
RINGBUFFER_POLL=1
RINGBUFFER_POLL_INTERVAL=10
RINGBUFFER_FAST_INTERVAL=10
RINGBUFFER_FAST_LOAD=3
# How long the watcher keeps polling after a healthy cycle. Must stay below
# INTERVAL so the next timer tick is never delayed.
RINGBUFFER_POLL_WINDOW=45

# Distributed-load notice. When the machine is busier than
# AGG_DISTRIBUTED_CPU_PCT but no single process reaches AGG_DISTRIBUTED_TOP_PCT,
# the report says so explicitly and points at the aggregated executable totals —
# otherwise a worker-pool spike reads as "nothing was using the CPU".
AGG_DISTRIBUTED_CPU_PCT=90
AGG_DISTRIBUTED_TOP_PCT=15

# Web request attribution (--requests, and web.txt written at incident close).
# The access log is the only place the abused URL and client IP live. Logs are
# read with a bounded tail, never fully, and each read is timeout-wrapped.
#
# WEBLOG_DIRS overrides the search path (space-separated); empty uses the cPanel
# defaults (/etc/apache2/logs/domlogs, /usr/local/apache/domlogs, ...). Only the
# first existing directory is read.
WEBLOG_DIRS=
# Per-file tail cap: the incident just closed, so the window is at the log's end.
WEBLOG_MAX_LINES=200000
# Rows shown in the top-paths / top-IPs tables.
WEBLOG_TOP_ROWS=20
# Seconds any single log read may take before it is abandoned.
WEBLOG_READ_TIMEOUT=5
# WordPress endpoints bots hammer; counted separately so a flood stands out.
WEBLOG_ABUSE_ENDPOINTS="xmlrpc.php wp-login.php admin-ajax.php admin-post.php wp-cron.php"

# Optional lightweight metric plugins.
ENABLE_PLUGINS=1
PLUGIN_TIMEOUT=1
PLUGIN_DIRS=/opt/server-forensics/plugins/metrics:/etc/server-forensics/plugins/metrics
